site_name: SALSA
site_description: Shape Analysis for Lumbar Spine Assessments

repo_name: nsivakanthan/SALSA
repo_url: https://github.com/nsivakanthan/SALSA

theme:
  name: material

  # logo: images/salsa-logo.gif
  # favicon: images/salsa-icon.png

  features:
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
